<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta name="theme-color" content="#0170FE" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="RiverEdge" />
  <title>RiverEdge Mobile</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="logo192.png" />
  <style>
    html,
    body,
    #root {
      height: 100%;
      width: 100%;
      display: flex;
      /* Ensure #root behaves as flex container */
      flex: 1;

      /* Hide scrollbar for Chrome, Safari and Opera */
      -ms-overflow-style: none;
      /* IE and Edge */
      scrollbar-width: none;
      /* Firefox */
    }

    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        var scope = '/mobile/';
        navigator.serviceWorker.register(scope + 'sw.js', { scope: scope })
          .then(function (reg) { console.log('PWA: Service Worker registered', reg.scope); })
          .catch(function (err) { console.warn('PWA: Service Worker registration failed', err); });
      });
    }
  </script>
</body>

</html>
