<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RiverEdge SaaS</title>

    <meta name="theme-color" content="#141414" />

    <!-- SVAR 甘特图图标字体改为按需加载（utils/loadGanttIconsCss.ts），
         仅在用户打开甘特图组件时注入，减少默认首屏/登录页的外链资源与握手成本。 -->
</head>

<body>
    <div id="root">
        <!-- 首屏占位：在 React 加载前即显示，提升 FCP 感知 -->
        <div id="app-loading" style="display:flex;align-items:center;justify-content:center;background:#fff;color:#666;font-family:system-ui,sans-serif;font-size:16px;">
            <div style="text-align:center;">
                <div style="width:48px;height:48px;margin:0 auto 16px;border:3px solid rgba(0,0,0,0.08);border-top-color:#1890ff;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
                <span>加载中...</span>
            </div>
        </div>
    </div>
    <!-- 首屏加载超时提示：网络不稳定或连接重置时，提示用户重试 -->
    <script>
      (function(){
        var timeout = 15000;
        var t = setTimeout(function(){
          var root = document.getElementById('root');
          var loading = document.getElementById('app-loading');
          if (loading && loading.offsetParent !== null && root && !document.getElementById('app-load-timeout')) {
            var wrap = document.createElement('div');
            wrap.id = 'app-load-timeout';
            wrap.style.cssText = 'position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;z-index:9999;';
            wrap.innerHTML = '<div style="text-align:center;color:#666;"><p style="margin-bottom:12px;">加载时间较长，可能是网络不稳定</p><p><a href="javascript:location.reload()" style="color:#1890ff;">点击重试</a></p></div>';
            document.body.appendChild(wrap);
          }
        }, timeout);
        document.addEventListener('DOMContentLoaded', function(){ if (document.getElementById('root').children.length > 1) clearTimeout(t); });
      })();
    </script>
    <style>
      html,body{margin:0;padding:0;height:100%;box-sizing:border-box}
      *{box-sizing:border-box}
      #app-loading{position:fixed;inset:0}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
    <script type="module" src="./main.tsx"></script>
</body>

</html>
