<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 顶栏/登录页 LOGO 常用静态资源：尽早发起请求，减轻首帧后再补请求的延迟 -->
    <link rel="preload" as="image" href="/favicon.svg" />
    <link rel="preload" as="image" href="/img/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RiverEdge SaaS</title>

    <meta name="theme-color" content="#141414" />

    <!-- <1200 由 H5 接管（无平板中间档；原工作台 1200 假平板阈值）；开发跨端口；?desktop=1 留 PC -->
    <script>
      (function () {
        try {
          var path = location.pathname;
          if (path === '/mobile' || path.indexOf('/mobile/') === 0) return;
          var q = new URLSearchParams(location.search);
          if (q.get('desktop') === '1') {
            sessionStorage.setItem('riveredge_prefer_pc', '1');
            return;
          }
          if (sessionStorage.getItem('riveredge_prefer_pc') === '1') return;
          function goH5IfNeeded() {
            if (sessionStorage.getItem('riveredge_prefer_pc') === '1') return;
            if (!window.matchMedia('(max-width: 1199px)').matches) return;
            var port = location.port;
            var url = '/mobile/';
            if (port === '8100' || port === '5173') {
              url = location.protocol + '//' + location.hostname + ':8081/';
            }
            location.replace(url);
          }
          goH5IfNeeded();
          var mql = window.matchMedia('(max-width: 1199px)');
          if (mql.addEventListener) mql.addEventListener('change', goH5IfNeeded);
          else if (mql.addListener) mql.addListener(goH5IfNeeded);
          window.addEventListener('resize', goH5IfNeeded);
        } catch (e) {}
      })();
    </script>

    <!-- SVAR 甘特图图标字体改为按需加载（utils/loadGanttIconsCss.ts），
         仅在用户打开甘特图组件时注入，减少默认首屏/登录页的外链资源与握手成本。 -->
</head>

<body>
    <div id="root">
        <!--
          首屏占位：保持最简洁，不再渲染后台壳骨架（顶部栏/侧边栏/正文条纹）。
          React 挂载后会替换 #root 子节点；若 main 未执行，15s 后下方脚本提示重试。
        -->
        <div class="app-first-paint" data-app-first-paint aria-busy="true" aria-label="应用启动"></div>
    </div>
    <!-- 首屏加载超时：多为网络或静态资源路径错误（如 base 不一致导致 main.js 404） -->
    <script>
      (function(){
        var timeout = 15000;
        var t = setTimeout(function(){
          var root = document.getElementById('root');
          var fp = root && root.querySelector('[data-app-first-paint]');
          if (fp && fp.isConnected && !document.getElementById('app-load-timeout')) {
            var wrap = document.createElement('div');
            wrap.id = 'app-load-timeout';
            wrap.style.cssText = 'position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;z-index:9999;';
            wrap.innerHTML = '<div style="text-align:center;color:#666;max-width:320px;padding:16px;"><p style="margin-bottom:12px;">页面未能完成加载，请检查网络或静态资源路径（如 /assets/ 是否可访问）</p><p><a href="javascript:location.reload()" style="color:#1890ff;">点击重试</a></p></div>';
            document.body.appendChild(wrap);
          }
        }, timeout);
      })();
    </script>
    <!-- 外链样式：避免 Windows + preserveSymlinks 下 Vite html-inline-proxy 对 <style> 解析失败 -->
    <link rel="stylesheet" href="./first-paint.css" />
    <script type="module" src="./main.tsx"></script>
</body>

</html>
