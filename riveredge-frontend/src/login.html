<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RiverEdge SaaS - 登录</title>

    <meta name="theme-color" content="#141414" />

    <!-- 外链样式：避免 Windows + preserveSymlinks 下 Vite html-inline-proxy 对 <style> 解析失败 -->
    <link rel="stylesheet" href="./login-shell.css" />

    <!-- 入口脚本：构建后由 Vite 注入 hash -->
    <script type="module" src="./login.tsx"></script>
</head>

<body>
    <!-- 独立登录 MPA：无静态骨架，由 login.tsx 最小 bundle 尽快挂载 React -->
    <div id="root" data-login-mpa="true"></div>
</body>

</html>
