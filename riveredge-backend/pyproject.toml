# 注意：本项目不发布包，使用 UV 静态版本管理（uv.lock）
# 已移除 build-system 配置，避免生成 egg-info 目录
# UV 通过 [project] 部分管理依赖，通过 uv.lock 锁定版本

[project]
name = "riveredge-backend"
version = "1.0.0"
description = "RiverEdge SaaS 多组织框架 - 后端 Monorepo"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.30.0,<0.31.0",  # 兼容Python 3.11的稳定版
    "pydantic>=2.9.0,<2.10.0",  # 主流稳定版
    "pydantic-settings>=2.6.0,<2.7.0",  # 主流稳定版
    "email-validator>=2.0.0",  # Pydantic EmailStr 类型验证所需
    "tortoise-orm==0.21.1",  # 回退到原来稳定版本
    "aerich==0.7.1",  # 固定稳定版本，避免0.9.2的格式检测问题
    "asyncpg>=0.29.0",  # PostgreSQL 异步驱动,Python 3.11+ 预编译包
    "python-jose[cryptography]>=3.3.0",  # JWT 认证
    "httpx>=0.27.0,<0.28.0",  # 主流稳定版
    "influxdb-client>=1.49.0,<2.0.0",
    "aiomqtt>=2.3.0,<3.0.0",
    "loguru>=0.7.3,<0.8.0",  # 主流稳定版
    "passlib[bcrypt]>=1.7.4",  # 密码加密
    "python-multipart>=0.0.9",  # 表单数据处理
    "python-dotenv>=1.0.0",
    "pypinyin>=0.51.0",
    "aiofiles>=23.2.1",  # 异步文件操作库,用于文件上传、下载等操作
    "cos-python-sdk-v5>=1.9.30,<2",  # 腾讯云 COS 官方签名与上传（避免手写签名不一致）
    "openpyxl>=3.1.0",  # Excel文件生成（MIT许可证，商业友好）
    "qrcode[pil]>=7.4.0",  # 二维码生成库（支持PIL图片生成）
    "pyzbar>=0.1.9",  # 二维码解析库（可选，用于从图片解析二维码）
    "pypdf>=5.0.0",  # 数电发票 PDF 内嵌图提取（验票 QR 解析）
    "aiosmtplib>=3.0.1", # 异步 SMTP 客户端
    "tzdata>=2025.3",
    "jinja2>=3.1.4",
    "taskiq>=0.12.0",
    "taskiq-postgres[asyncpg]>=0.7.0",
    "webauthn>=2.7.1",
    "pymssql>=2.3.0,<3",
    "pyodbc>=5.0.0,<6",
    "pyaxmlparser>=0.3.31",
    "minio>=7.2.0,<8",
    "pyahocorasick>=2.1.0,<3",
]

# Playwright：HTML→PDF。fast-deploy 在 PLAYWRIGHT_POSTINSTALL_ENABLE=1 时 uv sync --extra pdf 并安装 Chromium。
# 浏览器目录见 deploy.env PLAYWRIGHT_BROWSERS_PATH（默认 .playwright-browsers/）。
# OCR：发票 PDF 明细。fast-deploy sync_backend_deps 默认始终 --extra ocr。
# Linux 系统库：libzbar0 + libgomp1 + libgl1（opencv）；Python 侧强制 opencv-python-headless，避免无头服务器缺 libGL。
[project.optional-dependencies]
pdf = [
    "playwright>=1.57.0,<1.58",
]
ocr = [
    "pymupdf>=1.24.0",
    "rapidocr-onnxruntime>=1.3.0",
    "opencv-python-headless>=4.8.0",
]
kuaiai-rag = [
    "llama-index-core>=0.12.0,<0.13",
    "pgvector>=0.3.0,<0.4",
]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 未声明该插件与模式时，仓库里全部 @pytest.mark.asyncio 测试会以
# 「async def functions are not natively supported」静默计为失败/不执行。
asyncio_mode = "strict"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | venv311
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

# aerich 会从 TORTOISE_ORM 读连接池；database.py 会在检测到 aerich CLI（或 AERICH_MIGRATE=1）时使用小池子，减轻 PostgreSQL max_connections 占满。
[tool.aerich]
tortoise_orm = "infra.infrastructure.database.database.TORTOISE_ORM"
location = "./migrations"
src_folder = "./src"

[tool.uv]
# UV 静态版本管理配置
# 使用 uv.lock 锁定依赖版本，不发布包，不生成 egg-info
# 通过 uv sync --no-install-project 同步依赖，避免安装项目本身
# rapidocr 依赖 opencv-python（需 libGL）；生产无头机改用 headless，并禁止再装带 GUI 的 opencv-python
override-dependencies = [
    "opencv-python ; python_version < '0'",
]
