name: Permission Guardrails

on:
  pull_request:
    paths:
      - "src/apps/**/manifest.json"
      - "scripts/validate_manifest_permissions.py"
  push:
    branches: ["main", "master"]
    paths:
      - "src/apps/**/manifest.json"
      - "scripts/validate_manifest_permissions.py"

jobs:
  validate-manifest-permissions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate manifest permissions
        run: python scripts/validate_manifest_permissions.py --strict-menu-sync
